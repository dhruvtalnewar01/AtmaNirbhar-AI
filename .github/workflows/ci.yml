name: AtmaNirbhar AI CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-validation:
    name: Backend Syntax & Imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Lint and Syntax Validation
        run: |
          python -m py_compile backend/app/main.py
          python -m py_compile backend/app/schemas.py
          python -m py_compile backend/app/pipeline/audio.py
          python -m py_compile backend/app/pipeline/risk.py
          python -m py_compile backend/app/pipeline/collision.py

  frontend-validation:
    name: Frontend Build & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install --no-audit
      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build
